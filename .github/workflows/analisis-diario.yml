name: Analisis diario de acciones

on:
  schedule:
    # Con 5 tickers x 5 llamadas a Alpha Vantage = 25/día, justo el límite gratuito.
    # Por eso dejamos UNA sola ejecución diaria (apertura), no 3 — así el cupo
    # completo se usa de una vez y los datos salen frescos.
    #   13:35 UTC -> ~09:35 hora New York -> ~10:35 hora Chile (horario de verano ET, sep-nov)
    # Cuando EE.UU. cambie a horario de invierno (principios de noviembre),
    # hay que sumarle 1 hora (13:35 -> 14:35).
    - cron: "35 13 * * 1-5"
  # workflow_dispatch te permite correrlo manualmente desde GitHub cuando quieras probar
  workflow_dispatch:

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el analista
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python analista.py

      - name: Guardar historial de recomendaciones
        uses: actions/upload-artifact@v4
        with:
          name: recomendaciones
          path: recomendaciones.jsonl

      - name: Commitear historial de vuelta al repo
        run: |
          git config user.name "asesor-bot"
          git config user.email "asesor-bot@users.noreply.github.com"
          git add recomendaciones.jsonl posiciones.json
          git diff --staged --quiet || git commit -m "Actualiza recomendaciones y posiciones $(date -u +%F_%H:%M)"
          git push
